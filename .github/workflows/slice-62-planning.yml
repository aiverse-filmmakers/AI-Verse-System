name: Slice 6.2 Bounded Planning

on:
  push:
    branches: [slice-6.2-planning]
    paths:
      - ".github/workflows/slice-62-planning.yml"

permissions:
  contents: write

jobs:
  plan-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record Slice 6.2 bounded planning only
        shell: bash
        run: |
          set -euo pipefail
          # The helper performs roadmap-only bounded planning bookkeeping.
          python .github/slice-62-planning.py
          rm .github/slice-62-planning.py
          rm .github/workflows/slice-62-planning.yml
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^...//' | sort)
          expected=(
            ".github/slice-62-planning.py"
            ".github/workflows/slice-62-planning.yml"
            "docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${changed[*]}" != "${expected_sorted[*]}" ]; then
            printf 'unexpected changed files:\n%s\n' "${changed[@]}" >&2
            exit 1
          fi
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add -A
          git commit -m "Plan Slice 6.2 end-to-end qualification"
          git push origin HEAD:slice-6.2-planning
