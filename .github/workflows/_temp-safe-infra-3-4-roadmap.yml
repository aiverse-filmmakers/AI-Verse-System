name: Temporary Safe Infrastructure 3.4 Roadmap

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/_temp_safe_infra_3_4_trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-roadmap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch canonical roadmap
        run: |
          python scripts/_temp_safe_infra_3_4_roadmap.py
          git diff --check
          git diff --exit-code --quiet && { echo 'Guarded helper produced no roadmap change' >&2; exit 1; } || true

      - name: Commit guarded roadmap update to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI-VERSE'
          git config user.email 'hello@bogdanpascal.com'
          git add docs/SAFE-INFRASTRUCTURE-UPGRADE-AND-RECOVERY-IMPLEMENTATION-PLAN.md
          git commit -m 'Complete Safe Infrastructure Slice 3.4 roadmap'
          git push origin HEAD:${{ github.head_ref }}
