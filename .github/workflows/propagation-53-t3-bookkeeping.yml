name: Propagation Slice 5.3 T3 Bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/propagation-53-t3-bookkeeping.yml

permissions:
  contents: write

jobs:
  record-t3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Slice 5.3 T3 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')

          old_count = '**Adaptive tasks:** 2/4 complete'
          if text.count(old_count) != 1:
              raise SystemExit(f'expected one 5.3 task count, found {text.count(old_count)}')
          text = text.replace(old_count, '**Adaptive tasks:** 3/4 complete', 1)

          old_t3 = '- [ ] **5.3-T3** Prove positive and destructive-negative qualification/promotion regressions: exact qualified inputs may promote; owner failure or `setup-required`, clean-machine/status/doctor/health failure, preservation/member-payload failure, wrong or changed bound evidence, stale/unverified required inputs, intersecting/global `BLOCKING` drift and emergency safety-bypass attempts fail closed; emergency debt cannot weaken safety and later normal promotion remains blocked until the debt is reconciled.'
          new_t3 = old_t3.replace('- [ ]', '- [x]', 1)
          if text.count(old_t3) != 1:
              raise SystemExit(f'expected one unchecked 5.3-T3, found {text.count(old_t3)}')
          text = text.replace(old_t3, new_t3, 1)

          evidence = '''\n### T3 evidence\n\n- Permanent T3 regression coverage landed through Distribution PR `#41` at final merge head `87cf3268b0b5918ebfbaee7c4bba80bfcfd262ef`. The change is tests-only: `tests/test_promotion_qualification_regressions.py`; no qualification, promotion, candidate, release, channel, Registry/State, component-owner, runtime, member-payload or user-owned-state implementation was changed.\n- The new suite adds 17 focused positive/destructive-negative regressions. Exact qualified inputs may produce a read-only promotion plan without mutating live surfaces. Qualification fails closed for clean-install/status/health failure, member-payload collision/preservation failure, stale or wrong composed evidence, failed owner-native CI, unverified owner access, stale owner State and exact-frozen global `BLOCKING` drift. Promotion fails closed when bound Registry, Repository State or candidate-evidence bytes change after qualification.\n- Emergency promotion cannot bypass a failed safety gate and cannot run without explicit canonical `SYSTEM-SYNC-DEBT`. Open prior debt blocks later normal promotion; exact later canonical State reconciliation clears the block; reconciliation itself fails while the carried repository still reports debt. Existing T1 regressions continue to prove `setup-required`, failed doctor, preservation failure, wrong preservation revision, owner-admission failure and platform-scope mismatch fail closed, so the T3 matrix covers the full task wording without duplicating lower-level product logic.\n- PR-head Distribution CI `38804350058` passed all six Linux/macOS/Windows Python 3.11/3.12 jobs on exact T3 head `e76c4cf2b6c134e72da0b8daa252c71c0fabb78f`. The final tests-only harness was corrected before merge so existing T2 tests are not double-discovered.\n- Final clean-main Distribution CI `38804922520` passed all six jobs on exact merge head `87cf3268b0b5918ebfbaee7c4bba80bfcfd262ef`. Ubuntu/Python 3.11 job `116663177484` checked out that exact head, passed Candidate admission with `candidate_count: 0`, all 402 tests with 11 skips, all 17 T3 regressions, the existing T1/T2 qualification/promotion tests and CLI catalog smoke.\n- Post-merge catalog inspection confirms `core_candidates.json.release_sets` remains empty, `core_promotions.json.current_release` remains `core-first-run-rc1-2026-10-12`, and `system_sync_debts` remains `[]`. No live release, promotion or channel mutation occurred.\n- The carried OS concern remains unresolved by design: accepted OS `64f7325444d18f94c9d4755d32eb89f3468bda6b` can still report `Setup: setup-required` on the clean-machine Core path. T1/T3 qualification regressions prove that state cannot qualify or gain an emergency safety bypass. Repair or final disposition is not pulled into T3. No plan amendment was required.\n\n'''
          marker = new_t3 + '\n'
          if text.count(marker) != 1:
              raise SystemExit('T3 evidence insertion marker must occur once')
          text = text.replace(marker, marker + evidence, 1)

          stale = 'Slice 5.3 planning is complete. 5.3-T1 is complete; 5.3-T2 has not begun.'
          current = 'Slice 5.3 planning is complete. 5.3-T1, 5.3-T2 and 5.3-T3 are complete; 5.3-T4 has not begun.'
          if text.count(stale) != 1:
              raise SystemExit(f'expected one stale Slice 5.3 planning sentence, found {text.count(stale)}')
          text = text.replace(stale, current, 1)

          pointer_marker = '# Current execution pointer\n'
          if text.count(pointer_marker) != 1:
              raise SystemExit('execution pointer marker must occur once')
          before, pointer = text.split(pointer_marker, 1)

          old_current = '**Current slice:** Slice 5.3 - Promotion and qualification (`IN PROGRESS`, 2/4 tasks complete)  '
          new_current = '**Current slice:** Slice 5.3 - Promotion and qualification (`IN PROGRESS`, 3/4 tasks complete)  '
          if pointer.count(old_current) != 1:
              raise SystemExit(f'expected one old pointer count, found {pointer.count(old_current)}')
          pointer = pointer.replace(old_current, new_current, 1)

          old_next = '**Next:** 5.3-T3 - prove positive and destructive-negative qualification/promotion regressions: exact qualified inputs may promote; owner failure or `setup-required`, clean-machine/status/doctor/health failure, preservation/member-payload failure, wrong or changed bound evidence, stale/unverified required inputs, intersecting/global `BLOCKING` drift and emergency safety-bypass attempts fail closed; emergency debt cannot weaken safety and later normal promotion remains blocked until the debt is reconciled  '
          new_next = '**Next:** 5.3-T4 - run clean Distribution and required System cross-validation for the adopted qualification/promotion path, record exact release/debt/drift and carried OS-concern disposition, close Slice 5.3, advance to 5.4, and stop without beginning durable release receipts  '
          if pointer.count(old_next) != 1:
              raise SystemExit(f'expected one T3 next pointer, found {pointer.count(old_next)}')
          pointer = pointer.replace(old_next, new_next, 1)

          blocker = ('**Blockers/drift/amendments:** 5.3-T3 is accepted at final Distribution '
                     '`87cf3268b0b5918ebfbaee7c4bba80bfcfd262ef` with clean Distribution CI `38804922520` '
                     'successful across all six Linux/macOS/Windows Python 3.11/3.12 jobs and 402 Ubuntu/Python 3.11 tests with 11 skips. '
                     'The permanent T3 suite adds 17 focused qualification/promotion regressions and the existing T1/T2 gates remain green. '
                     'The live candidate overlay remains empty; `current_release` remains `core-first-run-rc1-2026-10-12`; `system_sync_debts` '
                     'remains empty; no live release, promotion or channel mutation occurred. The carried clean-machine OS concern remains unresolved: '
                     'accepted OS `64f7325444d18f94c9d4755d32eb89f3468bda6b` may report `setup-required`, and qualification now has permanent '
                     'regression proof that this state and failed doctor/health/preservation/owner evidence cannot pass or be bypassed by emergency '
                     'promotion. Canonical State freshness/drift disposition is intentionally unchanged in T3; final clean Distribution/System '
                     'cross-validation and exact drift/debt/OS-concern disposition belong to 5.3-T4. `compact-release-receipt-not-yet-implemented` '
                     'remains open `INFO` for 5.4. No plan amendment required. 5.3-T4 has not begun.')
          pointer, n = re.subn(r'^\*\*Blockers/drift/amendments:\*\* .*$', blocker, pointer, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit('expected one blocker line')

          text = before + pointer_marker + pointer
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify roadmap-only diff
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md"
          git diff --numstat -- docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md

      - name: Commit T3 bookkeeping
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Record Slice 5.3 T3 qualification promotion regressions"
          git push origin HEAD:main
