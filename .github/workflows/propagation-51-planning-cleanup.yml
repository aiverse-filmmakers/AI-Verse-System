name: Propagation Slice 5.1 Planning Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-51-planning-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate execution pointer heading
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')
          duplicate = '# Current execution pointer\n\n# Current execution pointer\n\n'
          if text.count(duplicate) != 1:
              raise SystemExit(f'duplicate pointer heading count={text.count(duplicate)}')
          text = text.replace(duplicate, '# Current execution pointer\n\n', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit pointer cleanup
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Clean Slice 5.1 planning pointer"
          git push origin HEAD:main
