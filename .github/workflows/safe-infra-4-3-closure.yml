name: Apply Safe Infrastructure Slice 4.3 closure

on:
  push:
    branches: [safe-infra-4.3-closure]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe-infra-4.3-closure
          fetch-depth: 0
      - name: Apply guarded closure edits
        run: python tools/apply_safe_infra_4_3_closure.py
      - name: Commit closure docs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No closure changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SAFE-INFRASTRUCTURE-UPGRADE-AND-RECOVERY-IMPLEMENTATION-PLAN.md
          git commit -m "Close Safe Infrastructure Slice 4.3 roadmap"
          git push origin HEAD:safe-infra-4.3-closure
