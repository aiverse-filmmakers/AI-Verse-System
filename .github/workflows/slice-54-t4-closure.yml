name: Slice 5.4 T4 Closure

on:
  push:
    branches:
      - slice-5.4-t4-closure
    paths:
      - '.github/workflows/slice-54-t4-closure.yml'
      - 'tests/test_system_truth_reconciliation.py'

permissions:
  contents: write

jobs:
  close-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve receipt drift from exact accepted evidence
        run: python .github/slice-54-t4-close.py prepare

      - name: Publish closing Core scoped State
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_repository_state.py --refresh --scope Core --evidence-revision ec6d09817edfc343a0f8d61006d4e3a3bd8329f6 --write-state

      - name: Regenerate canonical ledger
        run: python scripts/refresh_repository_state.py --write-ledger

      - name: Finalize Slice 5.4 roadmap closure
        env:
          SYSTEM_CLOSURE_RUN_ID: ${{ github.run_id }}
        run: python .github/slice-54-t4-close.py finalize

      - name: Validate closing contracts and reconciled drift regression
        run: |
          python scripts/validate_repository_registry.py governance/repository-registry.json
          python scripts/validate_repository_state.py governance/repository-state.json
          python scripts/refresh_repository_state.py --check-ledger
          python -m unittest discover -s tests -p "test_*.py"

      - name: Guard closure write scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- . ':!docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md'
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          for path in "${changed[@]}"; do
            case "$path" in
              governance/repository-state.json|docs/REPOSITORY-STATE-LEDGER.md|docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md|.github/slice-54-t4-close.py|.github/workflows/slice-54-t4-closure.yml) ;;
              *)
                echo "SLICE 5.4 T4 WRITE-SCOPE VIOLATION: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit canonical closure only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add governance/repository-state.json docs/REPOSITORY-STATE-LEDGER.md docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git rm .github/slice-54-t4-close.py .github/workflows/slice-54-t4-closure.yml
          git diff --cached --check -- . ':!docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md'
          git commit -m "Close Slice 5.4 durable release receipts"
          git push origin HEAD:slice-5.4-t4-closure
