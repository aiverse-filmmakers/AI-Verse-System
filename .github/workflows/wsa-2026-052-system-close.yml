name: WSA-2026-052 System Closure Patch

on:
  push:
    branches:
      - repair/close-wsa-2026-052
    paths:
      - ".github/workflows/wsa-2026-052-system-close.yml"
      - "scripts/wsa_2026_052_system_close.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/close-wsa-2026-052
          fetch-depth: 0
      - name: Patch canonical closure state
        run: python scripts/wsa_2026_052_system_close.py
      - name: Commit closure state
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/public-beta-audit/findings/FINDING-REGISTER.md docs/public-beta-audit/repairs/REPAIR-EXECUTION-TRACKER-2026-09-17.md
          git diff --cached --exit-code && { echo "No closure patch produced"; exit 1; }
          git commit -m "Close WSA-2026-052 and activate WSA-2026-014"
          git push origin HEAD:repair/close-wsa-2026-052
