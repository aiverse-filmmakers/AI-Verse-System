name: Propagation Slice 5.3 T4 Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/propagation-53-t4-closure.yml

permissions:
  contents: write

jobs:
  close-slice-53:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh canonical Core State and ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python scripts/refresh_repository_state.py --refresh --scope Core --write-state --write-ledger
          python scripts/validate_repository_registry.py governance/repository-registry.json
          python scripts/validate_repository_state.py governance/repository-state.json
          python scripts/refresh_repository_state.py --check-ledger
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Record T4 evidence and close Slice 5.3
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          roadmap_path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          state_path = Path('governance/repository-state.json')
          text = roadmap_path.read_text(encoding='utf-8')
          state = json.loads(state_path.read_text(encoding='utf-8'))

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          repositories = {item['repository_id']: item for item in state.get('repositories', [])}
          distribution = repositories.get(1350081263)
          if not distribution:
              raise SystemExit('canonical Distribution repository id 1350081263 missing from State')
          distribution_head = distribution.get('observed_head')
          if distribution_head != '23a532737e94812d7dc4d53edf23fd23db1cbb02':
              raise SystemExit(f'fresh Core State did not observe exact T4 Distribution head: {distribution_head}')

          open_drift = [item for item in state.get('drift', []) if item.get('status') == 'open']
          refreshed_ids = set(state.get('refresh', {}).get('repository_ids', []))
          blocking = []
          for item in open_drift:
              if item.get('severity') != 'BLOCKING':
                  continue
              scope = item.get('scope')
              repo_ids = set(item.get('repository_ids') or [])
              if scope in {'Core', 'global'} or bool(repo_ids & refreshed_ids):
                  blocking.append(item)
          if blocking:
              raise SystemExit('fresh Core State contains intersecting/global BLOCKING drift: ' + ', '.join(item.get('id', '<unknown>') for item in blocking))

          if open_drift:
              drift_summary = ', '.join(
                  f"{item.get('id')} ({item.get('severity')}/{item.get('scope')})"
                  for item in open_drift
              )
          else:
              drift_summary = 'none'

          refresh_revision = state.get('refresh', {}).get('evidence_revision')
          refresh_status = state.get('refresh', {}).get('status')
          refresh_scope = state.get('refresh', {}).get('scope')
          if refresh_status != 'complete' or refresh_scope != 'Core':
              raise SystemExit(f'unexpected closing refresh state: status={refresh_status} scope={refresh_scope}')

          text = replace_once(text, '**Completed:** 15  ', '**Completed:** 16  ', 'header completed')
          text = replace_once(text, '**Remaining:** 5  ', '**Remaining:** 4  ', 'header remaining')
          text = replace_once(text, '**Overall progress:** 75.0%  ', '**Overall progress:** 80.0%  ', 'header progress')
          text = replace_once(text, '**Current phase progress:** 2/4 slices complete  ', '**Current phase progress:** 3/4 slices complete  ', 'header phase progress')
          text = replace_once(text, '**Slices until next phase:** 2  ', '**Slices until next phase:** 1  ', 'header until next phase')
          text = replace_once(text, '**Current slice:** 5.3 - Promotion and qualification  ', '**Current slice:** 5.4 - Durable release receipts  ', 'header current slice')
          text = replace_once(text, '**Current slice status:** IN PROGRESS  ', '**Current slice status:** NOT STARTED  ', 'header current status')
          text = replace_once(text, '**Next slice:** 5.4 - Durable release receipts', '**Next slice:** 6.1 - Cross-repo regression/evidence validation', 'header next slice')

          start_marker = '## Slice 5.3 - Promotion and qualification\n'
          end_marker = '## Slice 5.4 - Durable release receipts\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Slice 5.3/5.4 section markers are not unique')
          before, tail = text.split(start_marker, 1)
          section, after = tail.split(end_marker, 1)
          section = replace_once(section, '**Status:** IN PROGRESS  ', '**Status:** COMPLETE  ', '5.3 status')
          section = replace_once(section, '**Adaptive tasks:** 3/4 complete', '**Adaptive tasks:** 4/4 complete', '5.3 task count')

          old_t4 = '- [ ] **5.3-T4** Run clean Distribution and required System cross-validation for the adopted qualification/promotion path, record exact release/debt/drift and carried OS-concern disposition, close Slice 5.3, advance to 5.4, and stop without beginning durable release receipts.'
          new_t4 = old_t4.replace('- [ ]', '- [x]', 1)
          section = replace_once(section, old_t4, new_t4, '5.3-T4 checkbox')

          old_planning = 'Slice 5.3 planning is complete. 5.3-T1, 5.3-T2 and 5.3-T3 are complete; 5.3-T4 has not begun.'
          new_planning = 'Slice 5.3 planning and execution are complete. 5.3-T1 through 5.3-T4 are complete; Slice 5.3 is closed.'
          section = replace_once(section, old_planning, new_planning, '5.3 planning sentence')

          closure_run = os.environ.get('GITHUB_RUN_ID', '<unknown>')
          evidence = f'''\n\n### T4 evidence\n\n- Final validation-only Distribution evidence landed through PR `#42`. The corrected PR head was `e3c5cebd101d9dde23ba9a95adcd1f290e1151f4`; the merged clean-main Distribution head is `23a532737e94812d7dc4d53edf23fd23db1cbb02`. The PR changed only `docs/SLICE-5.3-T4-CROSS-VALIDATION.md`; no qualification, promotion, candidate, release, channel, owner, runtime, member-payload, migration, recovery or durable-receipt semantics changed.\n- Exact PR-head positive validation passed: Distribution CI `38807901407`; Clean Machine Agent Release Gate `38807901195`; Lifecycle Receipt Concurrency `38807901311`; Composed Two-System Isolation `38807901242` on Linux/macOS/Windows; Safe Infrastructure Regression `38807901390`; and Safe Infrastructure Convergence `38807901462`.\n- Exact PR-head Clean Machine Core Acceptance `38807901169` failed on Linux, macOS and Windows for the same carried release-specific concern: released Core set `core-first-run-rc1-2026-10-12` pins OS `64f7325444d18f94c9d4755d32eb89f3468bda6b`, whose doctor reports `Setup: setup-required` while Brain, Memory, Skills and Data are ready. This concern is not claimed resolved. T1-T3 qualification/promotion gates permanently fail closed for this condition, and emergency promotion cannot bypass it.\n- Exact clean-main validation on Distribution `23a532737e94812d7dc4d53edf23fd23db1cbb02` passed: Distribution CI `38808998735`, Safe Infrastructure Regression `38808998640`, and Safe Infrastructure Convergence `38808998662`, all across their required platform/Python matrices.\n- Post-validation live catalogs remain unchanged: candidate overlay is empty; `current_release` remains `core-first-run-rc1-2026-10-12`; `system_sync_debts` remains `[]`; and the released OS pin remains `64f7325444d18f94c9d4755d32eb89f3468bda6b`. No live candidate, release, promotion, default-channel or debt mutation occurred in T4.\n- System closure workflow `{closure_run}` performed a fresh canonical Core refresh and regenerated the deterministic ledger before closure. State refresh status is `{refresh_status}` with scope `{refresh_scope}`, evidence revision `{refresh_revision}`, and exact observed Distribution head `{distribution_head}`. Open canonical drift after refresh: {drift_summary}. No intersecting/global `BLOCKING` drift is open for this closing Core scope.\n- Durable release receipts remain explicitly out of scope for T4. Any open `compact-release-receipt-not-yet-implemented` INFO drift remains owned by Slice 5.4. No plan amendment was required.\n'''
          marker = new_t4 + '\n'
          section = replace_once(section, marker, marker + evidence, 'T4 evidence insertion')
          text = before + start_marker + section + end_marker + after

          pointer_marker = '# Current execution pointer\n'
          if text.count(pointer_marker) != 1:
              raise SystemExit('current execution pointer marker is not unique')
          before_pointer, pointer = text.split(pointer_marker, 1)
          pointer = replace_once(pointer, '**Completed:** 15/20  ', '**Completed:** 16/20  ', 'pointer completed')
          pointer = replace_once(pointer, '**Overall:** 75.0%  ', '**Overall:** 80.0%  ', 'pointer overall')
          pointer = replace_once(pointer, '**Phase progress:** 2/4  ', '**Phase progress:** 3/4  ', 'pointer phase progress')
          pointer = replace_once(pointer, '**Until Phase 6:** 2 slices  ', '**Until Phase 6:** 1 slice  ', 'pointer until phase 6')
          pointer = replace_once(pointer, '**Current slice:** Slice 5.3 - Promotion and qualification (`IN PROGRESS`, 3/4 tasks complete)  ', '**Current slice:** Slice 5.4 - Durable release receipts (`NOT STARTED`)  ', 'pointer current slice')

          old_next = '**Next:** 5.3-T4 - run clean Distribution and required System cross-validation for the adopted qualification/promotion path, record exact release/debt/drift and carried OS-concern disposition, close Slice 5.3, advance to 5.4, and stop without beginning durable release receipts  '
          new_next = '**Next:** Slice 5.4 start - perform only bounded discovery/planning for durable release receipts, record the adaptive task list and first execution task, then stop without implementing receipts  '
          pointer = replace_once(pointer, old_next, new_next, 'pointer next')

          blocker_line = (
              '**Blockers/drift/amendments:** Slice 5.3 is complete at Distribution '
              '`23a532737e94812d7dc4d53edf23fd23db1cbb02`. Final clean-main Distribution CI `38808998735`, '
              'Safe Infrastructure Regression `38808998640` and Safe Infrastructure Convergence `38808998662` are successful. '
              f'Fresh canonical Core State observes Distribution exactly at `{distribution_head}`; open canonical drift is {drift_summary}. '
              'Candidate overlay remains empty, `current_release` remains `core-first-run-rc1-2026-10-12`, and `system_sync_debts` remains empty. '
              'The released OS `64f7325444d18f94c9d4755d32eb89f3468bda6b` still has the release-specific clean-machine `setup-required` concern; '
              'it remains unresolved but is permanently fail-closed for new whole-product qualification/promotion and cannot be emergency-bypassed. '
              'Durable release receipts remain the next-slice concern. No plan amendment required. Slice 5.4 has not begun.'
          )
          pointer, count = re.subn(r'^\*\*Blockers/drift/amendments:\*\* .*$', blocker_line, pointer, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('expected exactly one pointer blocker line')
          text = before_pointer + pointer_marker + pointer

          roadmap_path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot closure workflow and verify bounded diff
        shell: bash
        run: |
          find scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm .github/workflows/propagation-53-t4-closure.yml
          changed="$(git status --short | sed -E 's/^...//' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            '.github/workflows/propagation-53-t4-closure.yml' \
            'docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md' \
            'docs/REPOSITORY-STATE-LEDGER.md' \
            'governance/repository-state.json' | sort)"
          test "$changed" = "$expected"

      - name: Commit Slice 5.3 closure
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add governance/repository-state.json docs/REPOSITORY-STATE-LEDGER.md docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Close Slice 5.3 promotion and qualification"
          git push origin HEAD:main
