name: Repository Drift Watchdog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-drift-watchdog
  cancel-in-progress: false

jobs:
  full-network-watchdog:
    name: Full registered-repository watchdog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact System head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Registry-derived global watchdog refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/run_repository_watchdog.py --write --observed-at "$observed_at"

      - name: Validate canonical State and generated ledger
        run: |
          python scripts/validate_repository_registry.py governance/repository-registry.json
          python scripts/validate_repository_state.py governance/repository-state.json
          python scripts/refresh_repository_state.py --check-ledger
          python -m unittest discover -s tests -p "test_*.py"

      - name: Guard System-only publication scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              governance/repository-state.json|docs/REPOSITORY-STATE-LEDGER.md) ;;
              *)
                echo "WATCHDOG WRITE-SCOPE VIOLATION: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Publish heartbeat to System only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-VERSE Watchdog"
          git config user.email "hello@bogdanpascal.com"
          git add governance/repository-state.json docs/REPOSITORY-STATE-LEDGER.md
          if git diff --cached --quiet; then
            echo "No heartbeat content changed."
          else
            git commit -m "Record repository watchdog heartbeat"
            git push origin HEAD:main
          fi

      - name: Fail visibly unless the persisted heartbeat is current
        run: |
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/run_repository_watchdog.py --check-current --now "$now"
