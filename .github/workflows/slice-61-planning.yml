name: Slice 6.1 Bounded Planning

on:
  push:
    branches:
      - slice-6.1-planning
    paths:
      - '.github/workflows/slice-61-planning.yml'

permissions:
  contents: write

jobs:
  record-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record bounded Slice 6.1 plan only
        run: python .github/slice-61-plan.py

      - name: Guard planning write scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          for p in "${changed[@]}"; do
            case "$p" in
              docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md|.github/slice-61-plan.py|.github/workflows/slice-61-planning.yml) ;;
              *) echo "SLICE 6.1 PLANNING WRITE-SCOPE VIOLATION: $p" >&2; exit 1 ;;
            esac
          done

      - name: Commit roadmap planning and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git rm .github/slice-61-plan.py .github/workflows/slice-61-planning.yml
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' .github/slice-61-plan.py .github/workflows/slice-61-planning.yml docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m "Plan Slice 6.1 cross-repo regression validation"
          git push origin HEAD:slice-6.1-planning
