name: Propagation Slice 4.3 T5 State Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-43-t5-state-refresh.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh Apps, Agent, then Full scopes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/refresh_repository_state.py --refresh --scope component --component ai-verse-apps --evidence-revision "$GITHUB_SHA" --write-state --write-ledger
          python scripts/refresh_repository_state.py --refresh --scope Agent --evidence-revision "$GITHUB_SHA" --write-state --write-ledger
          python scripts/refresh_repository_state.py --refresh --scope Full --evidence-revision "$GITHUB_SHA" --write-state --write-ledger
          python scripts/validate_repository_state.py
          python scripts/refresh_repository_state.py --check-ledger
      - name: Assert T5 fail-closed observations
        shell: python
        run: |
          import json
          from pathlib import Path

          state = json.loads(Path('governance/repository-state.json').read_text())
          registry = json.loads(Path('governance/repository-registry.json').read_text())
          by_id = {x['repository_id']: x for x in state['repositories']}
          reg = {x['component_id']: x for x in registry['repositories']}

          expected_heads = {
              'ai-verse-gateway': '95cc8319c1dc95b05da0ebb451d70469170ca3f8',
              'ai-verse-automations': 'fda8b25b11b8419113a2625d09fd3da66b61064f',
              'ai-verse-multiple-bots': 'b4ad4315e560db0f60615e7c5ea59cb13c86969b',
              'ai-verse-token': '363dde3d87edaf8e7acd072c542775017f0b5dbf',
              'ai-verse-connections': 'b557ef1d83a9d6c802070887ca84c3b3df2aef29',
              'ai-verse-dashboard': 'ec5d40aea7fa3111357c086660a2630cef20f51a',
              'ai-verse-apps': 'db5b0115bf59d6eae9149137a40e891968f3a637',
          }
          active = [
              'ai-verse-gateway','ai-verse-automations','ai-verse-multiple-bots',
              'ai-verse-token','ai-verse-connections','ai-verse-dashboard'
          ]
          for component in active:
              item = by_id[reg[component]['repository_id']]
              assert item['access'] == 'verified', (component, item['access'])
              assert item['observed_head'] == expected_heads[component], (component, item['observed_head'])
              assert item['descriptor']['status'] == 'observed', (component, item['descriptor'])
              assert item['descriptor']['release_status'] == 'candidate', (component, item['descriptor'])
              assert item['owner_acceptance']['status'] == 'unverified', (component, item['owner_acceptance'])
          for component in ['ai-verse-connections','ai-verse-dashboard']:
              item = by_id[reg[component]['repository_id']]
              assert item['distribution_pin']['status'] == 'unpinned', (component, item['distribution_pin'])
          apps = by_id[reg['ai-verse-apps']['repository_id']]
          assert apps['access'] == 'verified'
          assert apps['observed_head'] == expected_heads['ai-verse-apps']
          assert apps['descriptor']['status'] == 'not-applicable'
          assert apps['distribution_pin']['status'] == 'not-applicable'
          assert state['watchdog']['status'] == 'WATCHDOG-STALE'
          assert state['refresh']['scope'] == 'Full'
          assert state['refresh']['status'] == 'complete'
          print('T5 scoped observations fail-closed and exact')
      - name: Publish State and ledger
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add governance/repository-state.json docs/REPOSITORY-STATE-LEDGER.md
          git diff --cached --quiet && { echo 'No State changes to publish'; exit 1; }
          git commit -m "Publish Slice 4.3 T5 scoped repository state"
          git push origin HEAD:main
