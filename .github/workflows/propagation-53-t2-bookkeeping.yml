name: Propagation Slice 5.3 T2 Bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/propagation-53-t2-bookkeeping.yml

permissions:
  contents: write

jobs:
  record-t2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Slice 5.3 T2 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')

          old_count = '**Adaptive tasks:** 1/4 complete'
          if text.count(old_count) != 1:
              raise SystemExit(f'expected one 5.3 task count, found {text.count(old_count)}')
          text = text.replace(old_count, '**Adaptive tasks:** 2/4 complete', 1)

          old_t2 = '- [ ] **5.3-T2** Wire explicit promotion around the existing forward Core promotion/lineage/channel mechanics so only an exact passed whole-product qualification can become released/default; preserve immutable history and candidate separation, enforce normal System synchronization, and implement the emergency path only with the same safety gates plus explicit non-safety `SYSTEM-SYNC-DEBT` that blocks later normal promotion until exact reconciliation.'
          new_t2 = old_t2.replace('- [ ]', '- [x]', 1)
          if text.count(old_t2) != 1:
              raise SystemExit(f'expected one unchecked 5.3-T2, found {text.count(old_t2)}')
          text = text.replace(old_t2, new_t2, 1)

          evidence = '''\n### T2 evidence\n\n- Explicit Core promotion landed through PR `#39` and merge `9be47fe07a6c427d8d26fe625720383d25ecfe2f`, then the T2 loader-bypass hardening landed through PR `#40` at final Distribution head `d1775d9a1225e64b9063cc1841be3b6f0ca5b57d`. The adopted path extends the existing explicit candidate -> `core_promotions.json` -> forward Core lineage/channel mechanics rather than creating another release database.\n- `src/aiverse_distribution/core_promotion.py` now provides deterministic preview-first `plan_core_promotion(...)`, explicit `apply_core_promotion(...)`, bounded `reconcile_system_sync_debt(...)`, and promotion-ledger validation. `scripts/promote-core-candidate.py` exposes preview by default and requires `--apply` for mutation. Promotion requires the exact persisted `aiverse.distribution-whole-product-qualification/v1` result with every T1 safety gate passed, exact candidate evidence, byte-exact Registry/Repository State snapshots bound by that qualification, forward same-or-descendant lineage from the current Core release and compatible update admission from that exact current release.\n- Normal promotion requires scoped canonical `system_sync` to be `synchronized` or `not-applicable` and fails closed while any prior open `SYSTEM-SYNC-DEBT` exists. Emergency promotion preserves every candidate/owner/exact-ref/compatibility/migration/preservation/whole-product/member-isolation gate and may relax only already-explicit canonical `system_sync=debt`; Distribution records that carried non-safety debt with `canonical_system_sync_authority=false` and `records_non_safety_debt_only=true`. Later normal promotion remains blocked until exact later canonical Repository State evidence reconciles the debt. Distribution does not perform System synchronization itself.\n- Apply semantics preserve immutable history: the exact release is appended to the existing promotion ledger, `current_release` advances only after all gates pass, only the promoted candidate is removed from the explicit candidate overlay, and the public release manifest plus `qualification/<candidate-id>/promotion.json` are written without rewriting immutable candidate evidence. Existing historical U36 release `core-first-run-rc1-2026-10-12` is explicitly grandfathered rather than rewritten.\n- T2 review found one direct-data bypass: packaged `core_promotions.json` could be loaded into the release catalog before future promotion-governance validation. PR `#40` closed that T2 gap by validating the packaged promotion ledger at package import before it can expose a default channel; future non-grandfathered promotions without exact whole-product qualification evidence now fail closed even if the JSON is edited directly.\n- PR `#39` Distribution CI run `38800499557` passed all six Linux/macOS/Windows Python 3.11/3.12 jobs. Ubuntu/Python 3.11 passed Candidate admission, 385 tests with 11 skips including all four focused T2 promotion tests, and CLI catalog smoke. PR `#40` CI run `38801481552` also passed all six jobs with the same 385-test Ubuntu/Python 3.11 result.\n- Final clean-main Distribution CI run `38802003262` passed all six jobs on exact final T2 head `d1775d9a1225e64b9063cc1841be3b6f0ca5b57d`. Ubuntu/Python 3.11 job `116653148926` checked out that exact head, passed Candidate admission with an empty live overlay, all 385 tests with 11 skips, all four T2 promotion tests, all nine T1 whole-product qualification tests and CLI catalog smoke.\n- No live promotion occurred. At final T2 head, `core_candidates.json` remains empty, `core_promotions.json.current_release` remains `core-first-run-rc1-2026-10-12`, and `system_sync_debts` remains `[]`. No Registry/State, component owner, member payload, runtime or user-owned state was mutated.\n- The carried clean-machine Core run `38757724853` remains unresolved product evidence because accepted OS `64f7325444d18f94c9d4755d32eb89f3468bda6b` reports `setup-required`; T1 qualification still fails closed on that state, so T2 cannot promote it by normal or emergency policy. No plan amendment was required.\n\n'''
          marker = new_t2 + '\n'
          if text.count(marker) != 1:
              raise SystemExit('T2 evidence insertion marker must occur once')
          text = text.replace(marker, marker + evidence, 1)

          pointer_marker = '# Current execution pointer\n'
          if text.count(pointer_marker) != 1:
              raise SystemExit('execution pointer marker must occur once')
          before, pointer = text.split(pointer_marker, 1)

          old_current = '**Current slice:** Slice 5.3 - Promotion and qualification (`IN PROGRESS`, 1/4 tasks complete)  '
          new_current = '**Current slice:** Slice 5.3 - Promotion and qualification (`IN PROGRESS`, 2/4 tasks complete)  '
          if pointer.count(old_current) != 1:
              raise SystemExit(f'expected one old pointer count, found {pointer.count(old_current)}')
          pointer = pointer.replace(old_current, new_current, 1)

          old_next = '**Next:** 5.3-T2 - wire explicit promotion around the existing forward Core promotion/lineage/channel mechanics so only an exact passed whole-product qualification can become released/default; preserve immutable history and candidate separation, enforce normal System synchronization, and implement the emergency path only with the same safety gates plus explicit non-safety `SYSTEM-SYNC-DEBT` that blocks later normal promotion until exact reconciliation, then stop without beginning destructive-negative promotion regressions  '
          new_next = '**Next:** 5.3-T3 - prove positive and destructive-negative qualification/promotion regressions: exact qualified inputs may promote; owner failure or `setup-required`, clean-machine/status/doctor/health failure, preservation/member-payload failure, wrong or changed bound evidence, stale/unverified required inputs, intersecting/global `BLOCKING` drift and emergency safety-bypass attempts fail closed; emergency debt cannot weaken safety and later normal promotion remains blocked until the debt is reconciled  '
          if pointer.count(old_next) != 1:
              raise SystemExit(f'expected one T2 next pointer, found {pointer.count(old_next)}')
          pointer = pointer.replace(old_next, new_next, 1)

          blocker = ('**Blockers/drift/amendments:** 5.3-T2 is accepted at final Distribution '
                     '`d1775d9a1225e64b9063cc1841be3b6f0ca5b57d` with clean Distribution CI `38802003262` '
                     'successful across all six jobs and 385 Ubuntu/Python 3.11 tests. The live candidate overlay remains empty; '
                     '`current_release` remains `core-first-run-rc1-2026-10-15`; `system_sync_debts` remains empty; no live release, '
                     'promotion or channel mutation occurred. The carried clean-machine run `38757724853` remains an unresolved whole-product '
                     'qualification concern because accepted OS `64f7325444d18f94c9d4755d32eb89f3468bda6b` reports `setup-required`; '
                     'T1 qualification still fails closed on that state and T2 provides no safety bypass. Canonical State freshness/drift disposition '
                     'is unchanged from T1: globally fresh with `WATCHDOG-CURRENT`, no open intersecting Core `BLOCKING` drift, and the previously '
                     'resolved adapter/watchdog drifts remain resolved. Connections and Dashboard remain unadmitted because Full is blocked; Apps '
                     'remains experimental/no-CI/unaccepted. `compact-release-receipt-not-yet-implemented` remains open `INFO` for 5.4. No plan '
                     'amendment required. 5.3-T3 has not begun.')
          # Correct the intentionally literal current release value before writing the blocker.
          blocker = blocker.replace('core-first-run-rc1-2026-10-15', 'core-first-run-rc1-2026-10-12')
          pointer, n = re.subn(r'^\*\*Blockers/drift/amendments:\*\* .*$', blocker, pointer, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit('expected one blocker line')

          text = before + pointer_marker + pointer
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify roadmap-only diff
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md"
          git diff --numstat -- docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md

      - name: Commit T2 bookkeeping
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Record Slice 5.3 T2 promotion gate"
          git push origin HEAD:main
