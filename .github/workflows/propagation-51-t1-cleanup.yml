name: Propagation Slice 5.1 T1 Roadmap Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-51-t1-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean T1 roadmap formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')
          duplicate = '# Current execution pointer\n\n# Current execution pointer\n\n'
          if text.count(duplicate) != 1:
              raise SystemExit(f'duplicate pointer count={text.count(duplicate)}')
          text = text.replace(duplicate, '# Current execution pointer\n\n', 1)
          tight = 'stop without beginning member-payload isolation.\n### T1 evidence\n'
          if text.count(tight) != 1:
              raise SystemExit(f'T1 evidence spacing count={text.count(tight)}')
          text = text.replace(tight, 'stop without beginning member-payload isolation.\n\n### T1 evidence\n', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit cleanup
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Clean Slice 5.1 T1 roadmap formatting"
          git push origin HEAD:main
