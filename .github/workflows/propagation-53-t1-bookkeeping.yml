name: Propagation Slice 5.3 T1 Bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/propagation-53-t1-bookkeeping.yml

permissions:
  contents: write

jobs:
  correct-t1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct stale planning sentence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')
          old = 'Slice 5.3 planning is complete. 5.3-T1 has not begun.'
          new = 'Slice 5.3 planning is complete. 5.3-T1 is complete; 5.3-T2 has not begun.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale planning sentence, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify roadmap-only diff
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md"
          git diff --numstat -- docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Correct Slice 5.3 T1 tracker sentence"
          git push origin HEAD:main
