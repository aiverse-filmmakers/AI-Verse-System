name: Temporary Safe Infrastructure 3.1 Roadmap Run

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-roadmap:
    if: "${{ github.event.head_commit.message == 'TEMP run Safe Infrastructure Slice 3.1 roadmap closer' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch canonical roadmap
        run: python scripts/_temp_close_safe_infra_3_1.py

      - name: Verify and commit guarded closure
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --porcelain -- docs/SAFE-INFRASTRUCTURE-UPGRADE-AND-RECOVERY-IMPLEMENTATION-PLAN.md)"
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M docs/SAFE-INFRASTRUCTURE-UPGRADE-AND-RECOVERY-IMPLEMENTATION-PLAN.md$' || true)"
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/SAFE-INFRASTRUCTURE-UPGRADE-AND-RECOVERY-IMPLEMENTATION-PLAN.md
          git commit -m "Complete Safe Infrastructure Slice 3.1 roadmap"
          git push origin HEAD:main
