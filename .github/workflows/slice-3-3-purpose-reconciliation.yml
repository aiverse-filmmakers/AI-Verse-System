name: Slice 3.3 Purpose Reconciliation

on:
  push:
    paths:
      - "scripts/apply_slice_3_3_purpose_reconciliation.py"
      - ".github/workflows/slice-3-3-purpose-reconciliation.yml"

permissions:
  contents: write

concurrency:
  group: slice-3-3-purpose-reconciliation
  cancel-in-progress: false

jobs:
  apply-exact-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact-match Purpose reconciliation
        run: python scripts/apply_slice_3_3_purpose_reconciliation.py

      - name: Guard write scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              docs/FINAL-AI-VERSE-BLUEPRINT.md|docs/SYSTEM-CHANGELOG.md) ;;
              *)
                echo "SLICE 3.3 WRITE-SCOPE VIOLATION: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit reconciled System truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-VERSE Reconciliation"
          git config user.email "hello@bogdanpascal.com"
          git add docs/FINAL-AI-VERSE-BLUEPRINT.md docs/SYSTEM-CHANGELOG.md
          git commit -m "Reconcile accepted Purpose Context v1 in System blueprint"
          git push origin HEAD:main
