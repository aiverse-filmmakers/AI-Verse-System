name: Repair Slice 6.1 T1 Bookkeeping Helper

on:
  push:
    branches: [slice-6.1-t1-bookkeeping]
    paths:
      - ".github/workflows/slice-61-t1-bookkeeping-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove inappropriate Markdown whitespace check and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/slice-61-t1-bookkeeping.yml')
          text = path.read_text(encoding='utf-8')
          old = '          git diff --check -- docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Markdown whitespace check')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add .github/workflows/slice-61-t1-bookkeeping.yml
          git rm .github/workflows/slice-61-t1-bookkeeping-repair.yml
          git commit -m "Repair Slice 6.1 T1 bookkeeping helper"
          git push origin HEAD:slice-6.1-t1-bookkeeping
