name: Propagation Slice 4.3 T5 Watchdog Fixture Alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-43-t5-watchdog-fixture.yml

permissions:
  contents: write

jobs:
  align-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align synthetic successful global scan fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_repository_watchdog.py')
          text = path.read_text()
          old = 'if status == "complete" and item["access"] == "unverified":'
          new = 'if status == "complete" and item["access"] != "verified":'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one fixture condition, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit fixture alignment
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add tests/test_repository_watchdog.py
          git commit -m "Align watchdog synthetic global refresh fixture"
          git push origin HEAD:main
