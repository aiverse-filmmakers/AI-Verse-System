name: Propagation Slice 5.1 T4 Concurrency Correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-51-t4-concurrency-correction.yml

permissions:
  contents: write

jobs:
  correct-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct final Distribution concurrency evidence
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- T4 preserved unrelated Safe Infrastructure movement through System `45893e1ef471bdabca3332bf6be1ba9c144ed76e`. Distribution remained exactly at T3 head `16d7f0b8a4a2e75f1fd3af8dea89b7c63d5a934b`; no Distribution product/release mutation was required for closure.":
              "- T4 preserved unrelated Safe Infrastructure movement through System `45893e1ef471bdabca3332bf6be1ba9c144ed76e` and final Distribution `d41c3abc1702fba85693c971de49a3a539ee7327`. The Distribution head is a seven-commit descendant of accepted T3 `16d7f0b8a4a2e75f1fd3af8dea89b7c63d5a934b`; its concurrent delta changes only `AGENTS.md`, `INSTALL.md`, `README.md`, `docs/HISTORY.md`, `docs/ROADMAP.md` and new `docs/SAFE-INFRASTRUCTURE-LIFECYCLE.md`, with no candidate-admission, catalog, release-set, promotion or qualification implementation change.",
              "- Exact current-head Distribution CI `38712853052` on `16d7f0b8a4a2e75f1fd3af8dea89b7c63d5a934b` is `SUCCESS` across all six Linux/macOS/Windows Python 3.11/3.12 jobs. Ubuntu/Python 3.11 passed the permanent Candidate admission gate and all 346 tests, including the T3 positive/destructive-negative matrix.":
              "- Exact current-head Distribution CI `38716176205` on `d41c3abc1702fba85693c971de49a3a539ee7327` is `SUCCESS` across all six Linux/macOS/Windows Python 3.11/3.12 jobs. Ubuntu/Python 3.11 passed the permanent Candidate admission gate, unit tests and catalog smoke, preserving the T3 positive/destructive-negative admission coverage on the concurrent Safe Infrastructure descendant.",
              "- Distribution remains at `16d7f0b8a4a2e75f1fd3af8dea89b7c63d5a934b`; CI `38712853052` passed all six platform/version jobs and 346 tests on the designated Ubuntu/Python 3.11 path.":
              "- Final Distribution is `d41c3abc1702fba85693c971de49a3a539ee7327`, a documentation-only Safe Infrastructure descendant of T3 `16d7f0b8a4a2e75f1fd3af8dea89b7c63d5a934b`; current-head CI `38716176205` passed all six platform/version jobs and the designated Ubuntu/Python 3.11 Candidate admission gate.",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one closure sentence to correct: {old[:80]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Verify corrected closure pointer remains closed
        shell: python
        run: |
          from pathlib import Path
          text = Path("docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md").read_text(encoding="utf-8")
          required = [
              "**Completed:** 14/20",
              "**Overall:** 70.0%",
              "**Current slice:** Slice 5.2 - Member payload isolation (`NOT STARTED`)",
              "d41c3abc1702fba85693c971de49a3a539ee7327",
              "38716176205",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f"missing corrected closure marker: {item}")
      - name: Commit concurrency correction
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git commit -m "Correct Slice 5.1 final Distribution evidence"
          git push origin HEAD:main
