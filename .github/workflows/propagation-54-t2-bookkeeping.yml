name: Propagation Slice 5.4 T2 Bookkeeping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/propagation-54-t2-bookkeeping.yml'

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only Slice 5.4 T2 roadmap bookkeeping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          once('**Adaptive tasks:** 1/4 complete', '**Adaptive tasks:** 2/4 complete', 'task count')

          t2 = '- [ ] **5.4-T2** Wire future Core final admission to construct, validate and atomically persist `qualification/<release-id>/release-receipt.json`, add the non-cyclic receipt reference to final release-set evidence, preserve immutable no-overwrite semantics, and fail closed before promotion/channel mutation when reconstruction evidence is incomplete or invalid; keep the member lifecycle receipt separate and perform no live promotion.'
          t2_done = t2.replace('- [ ]', '- [x]', 1)
          once(t2, t2_done, 'T2 checkbox')

          anchor = t2_done + '\n- [ ] **5.4-T3**'
          evidence = t2_done + '''\n\n### T2 evidence\n\n- Distribution PR `#44` implemented the future Core final-admission durable-receipt gate. Exact final PR head `7ffee7a6d864c026b1896424ca0c0649a5ebd1e4` merged to clean `main` as `fe55e47ed3a294d18ad9f3260ddf79079a5bcd7c`. The net PR delta is only `src/aiverse_distribution/core_promotion.py`, `tests/test_core_promotion.py`, `tests/test_release_receipt_admission.py` and `docs/RELEASE-RECEIPT.md`; no live catalog, release-set, qualification instance, member installation, Registry/State or ledger file changed.\n- Future Core final admission now builds and validates the complete `aiverse.distribution-release-receipt/v1` in memory before any promotion/channel catalog mutation, atomically publishes `qualification/<release-id>/release-receipt.json` with immutable no-overwrite semantics, persists the exact receipt-bound final release manifest and applied promotion evidence, and only then moves the Core promotion ledger/channel. Missing or changed reconstruction evidence fails closed before channel mutation.\n- The final release-set carries only the receipt schema, repository-relative receipt path and directional `receipt-binds-final-release-set` marker; the receipt hashes the final release-set bytes. This intentionally avoids a receipt/release-set digest cycle. Durable source release receipts remain separate from mutable member lifecycle/project receipts and carry no member/user-state recovery authority.\n- Focused implementation validation run `38913545103` passed 31/31 affected receipt/promotion tests. Initial PR CI `38913877215` correctly exposed a Windows CRLF byte-translation mismatch between persisted manifests and receipt hashes; T2 fixed persistence to deterministic UTF-8/LF bytes before merge. The focused cross-platform fix run `38914140364` passed 14/14 affected tests.\n- Final clean PR Distribution CI `38914697915` passed all six Linux/macOS/Windows Python 3.11/3.12 jobs. Clean-main Distribution CI `38916139668` passed the same six-job matrix on exact merge head `fe55e47ed3a294d18ad9f3260ddf79079a5bcd7c`; Ubuntu/Python 3.11 ran 412 tests with 11 expected skips, including all five permanent final-admission receipt regressions.\n- Exact live post-merge catalogs remain unchanged: the candidate overlay is empty, `current_release` remains `core-first-run-rc1-2026-10-12`, and `system_sync_debts` remains empty. No live promotion occurred. Canonical State/ledger were intentionally not refreshed in T2, so `compact-release-receipt-not-yet-implemented` remains the existing `INFO/Core` State record until the final Slice 5.4 closure task evaluates and publishes drift resolution. No plan amendment was required.\n\n- [ ] **5.4-T3**'''
          once(anchor, evidence, 'T2 evidence insertion')

          old_status = 'Slice 5.4 planning is complete and 5.4-T1 is complete. 5.4-T2 through 5.4-T4 have not begun. The receipt contract/builder/validator is read-only; no durable receipt has been persisted or wired into final admission yet. No plan amendment was required.'
          new_status = 'Slice 5.4 planning, 5.4-T1 and 5.4-T2 are complete. 5.4-T3 and 5.4-T4 have not begun. Future Core final admission is now durable-receipt-gated and cross-platform deterministic, but no live release was promoted and canonical State/ledger remain intentionally unchanged until the later closure task. No plan amendment was required.'
          once(old_status, new_status, 'slice status summary')

          old_pointer = '''**Current slice:** Slice 5.4 - Durable release receipts (`IN PROGRESS`, 1/4 tasks complete)  \n**Next:** 5.4-T2 - wire future Core final admission to construct, validate and atomically persist `qualification/<release-id>/release-receipt.json`, add the non-cyclic receipt reference to final release-set evidence, preserve immutable no-overwrite semantics, and fail closed before promotion/channel mutation when reconstruction evidence is incomplete or invalid; keep the member lifecycle receipt separate and perform no live promotion  \n**Blockers/drift/amendments:** 5.4-T1 is complete at Distribution `789935ce18edf9af7c9882ddb7e697b6f4a3ebe9` via PR `#43`; PR CI `38890385790` and clean-main CI `38890839565` both passed all six Linux/macOS/Windows Python 3.11/3.12 jobs. The read-only `aiverse.distribution-release-receipt/v1` builder/validator now binds the required exact reconstruction authorities and rejects private/user-state content; qualification can preserve explicit repository-local preservation/composed source refs without changing promotion semantics. No receipt is persisted and no final-admission/promotion wiring exists yet, so `compact-release-receipt-not-yet-implemented` remains open `INFO/Core`. Historical U36 evidence, live catalogs/channels/debts, canonical State/ledger, member installations and user-owned state are unchanged. No plan amendment required. 5.4-T2 has not begun.'''
          new_pointer = '''**Current slice:** Slice 5.4 - Durable release receipts (`IN PROGRESS`, 2/4 tasks complete)  \n**Next:** 5.4-T3 - add permanent positive and destructive-negative reconstruction regressions proving exact receipt reconstruction and failure on changed/missing release-set bytes, qualification/evidence bindings, component/descriptor/owner refs, Registry/State, dependency locks, compatibility/preservation/promotion/debt facts, unsafe/floating refs, secret/private/user-state leakage or attempted duplicate authority; preserve historical U36 release evidence unchanged and keep planning paths read-only  \n**Blockers/drift/amendments:** 5.4-T2 is complete at Distribution `fe55e47ed3a294d18ad9f3260ddf79079a5bcd7c` via PR `#44`; final clean PR CI `38914697915` and clean-main CI `38916139668` both passed all six Linux/macOS/Windows Python 3.11/3.12 jobs, with 412 tests and 11 expected skips on clean-main Ubuntu/Python 3.11. The initial Windows CRLF receipt-hash mismatch was detected by PR CI and corrected before merge with deterministic UTF-8/LF persisted bytes. Future Core final admission now validates and immutably persists the durable receipt before promotion/channel mutation and uses a non-cyclic final release-set receipt reference; missing reconstruction evidence and pre-existing receipt history fail closed. Live candidate overlay remains empty, `current_release` remains `core-first-run-rc1-2026-10-12`, sync debt remains empty, and no live promotion occurred. Canonical State/ledger were not refreshed, so `compact-release-receipt-not-yet-implemented` remains the existing `INFO/Core` record for later Slice 5.4 closure evaluation. No plan amendment required. 5.4-T3 has not begun.'''
          once(old_pointer, new_pointer, 'current execution pointer')

          path.write_text(text, encoding='utf-8')
          PY

          test ! -e governance/repository-state.json.tmp
          git diff --check
          git diff --name-only | grep -qx 'docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md'
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git rm .github/workflows/propagation-54-t2-bookkeeping.yml
          git diff --cached --check
          git commit -m "Record Slice 5.4 T2 durable receipt admission"
          git push origin HEAD:main
