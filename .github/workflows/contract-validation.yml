name: Contract Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  component-release-descriptor:
    name: Component release descriptor / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate example descriptor
        run: python scripts/validate_component_release_descriptor.py contracts/examples/component-release-descriptor.valid.json

      - name: Validate whole-release preservation example
        run: python scripts/validate_release_preservation_result.py contracts/examples/release-preservation-result.valid.json

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
