name: Slice 3.3 Closure

on:
  push:
    paths:
      - "scripts/apply_slice_3_3_closure.py"
      - ".github/workflows/slice-3-3-close.yml"

permissions:
  contents: write

concurrency:
  group: slice-3-3-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact Slice 3.3 closure bookkeeping
        run: python scripts/apply_slice_3_3_closure.py

      - name: Guard closure scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md|scripts/apply_slice_3_3_closure.py|.github/workflows/slice-3-3-close.yml) ;;
              *)
                echo "SLICE 3.3 CLOSURE SCOPE VIOLATION: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit clean closure state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-VERSE Reconciliation"
          git config user.email "hello@bogdanpascal.com"
          git add -A
          git commit -m "Close Slice 3.3 and Phase 3"
          git push origin HEAD:main
