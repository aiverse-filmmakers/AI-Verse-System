name: Propagation Slice 5.4 T3 Bookkeeping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/propagation-54-t3-bookkeeping.yml'

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only Slice 5.4 T3 roadmap bookkeeping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')

          start = text.index('## Slice 5.4 - Durable release receipts')
          end = text.index('\n# Phase 6 - Prove the network and close', start)
          section = text[start:end]

          def once_local(old, new, label):
              global section
              count = section.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              section = section.replace(old, new, 1)

          once_local('**Adaptive tasks:** 2/4 complete', '**Adaptive tasks:** 3/4 complete', 'task count')

          t3 = '- [ ] **5.4-T3** Add permanent positive and destructive-negative reconstruction regressions proving exact receipt reconstruction and failure on changed/missing release-set bytes, qualification/evidence bindings, component/descriptor/owner refs, Registry/State, dependency locks, compatibility/preservation/promotion/debt facts, unsafe/floating refs, secret/private/user-state leakage or attempted duplicate authority; preserve historical U36 release evidence unchanged and keep planning paths read-only.'
          t3_done = t3.replace('- [ ]', '- [x]', 1)
          once_local(t3, t3_done, 'T3 checkbox')

          anchor = t3_done + '\n- [ ] **5.4-T4**'
          evidence = t3_done + '''\n\n### T3 evidence\n\n- Distribution PR `#45` added one permanent tests-only file, `tests/test_release_receipt_reconstruction_regressions.py`. Exact final PR head `eb4f540f46af3dacb01b263160e0e179ef440b3b` merged to clean `main` as `f407302df93fee18ae407d59cf0409227436ddfe`. No product/runtime code, catalog, release-set, qualification instance, receipt instance, member installation, Registry/State or ledger file changed.\n- The permanent matrix proves exact persisted-source reconstruction without mutation and destructive failure for changed/missing release-set bytes; changed/missing qualification and candidate evidence; component revision, descriptor source and owner-native acceptance drift; changed/missing Registry/Repository State identity; dependency-lock and compatibility-source drift; preservation/composed-acceptance drift; changed/missing promotion evidence; compatibility/migration and exact sync-debt fact tampering; unsafe paths and floating refs; secret/private/member/user-state leakage; and attempted duplicate release, promotion, channel, Registry/State, owner or member/user-state authority. Promotion planning is explicitly proven read-only and creates no receipt, release-set or promotion artifact.\n- Historical `qualification/core-update-program-u36/release-evidence.json` remains byte-identical in canonical Git content with blob `0fec6e5290e659469a52a5f769da620f329f8c5a`; no historical U36 `release-receipt.json` was introduced or backfilled.\n- The first PR matrix exposed only a Windows checkout CRLF portability issue in the historical-byte assertion, not a receipt defect. The assertion was corrected to compare canonical Git content cross-platform. Final PR Distribution CI `39008232501` passed all six Linux/macOS/Windows Python 3.11/3.12 jobs on exact head `eb4f540f46af3dacb01b263160e0e179ef440b3b`; Ubuntu/Python 3.11 ran 431 tests with 11 expected skips and all T3 cases passed.\n- Clean-main Distribution CI `39008351455` passed the same six-job matrix on exact merge head `f407302df93fee18ae407d59cf0409227436ddfe`; Ubuntu/Python 3.11 again ran 431 tests with 11 expected skips. The candidate admission gate remained valid with an empty overlay.\n- Exact post-merge catalogs remain unchanged: candidate overlay empty, `current_release` still `core-first-run-rc1-2026-10-12`, and `system_sync_debts` empty. No live promotion or durable receipt instance was created. Canonical State/ledger are intentionally unchanged in T3, so `compact-release-receipt-not-yet-implemented` remains the existing `INFO/Core` State record for T4 closure evaluation. No plan amendment was required.\n\n- [ ] **5.4-T4**'''
          once_local(anchor, evidence, 'T3 evidence insertion')

          old_status = 'Slice 5.4 planning, 5.4-T1 and 5.4-T2 are complete. 5.4-T3 and 5.4-T4 have not begun. Future Core final admission is now durable-receipt-gated and cross-platform deterministic, but no live release was promoted and canonical State/ledger remain intentionally unchanged until the later closure task. No plan amendment was required.'
          new_status = 'Slice 5.4 planning and 5.4-T1 through 5.4-T3 are complete. 5.4-T4 has not begun. Future Core final admission is durable-receipt-gated, cross-platform deterministic and protected by permanent exact-reconstruction/destructive-negative regressions; no live release was promoted and canonical State/ledger remain intentionally unchanged until closure. No plan amendment was required.'
          once_local(old_status, new_status, 'slice status summary')

          text = text[:start] + section + text[end:]

          pointer_pattern = re.compile(
              r'^\*\*Current slice:\*\* Slice 5\.4 - Durable release receipts \(`IN PROGRESS`, 2/4 tasks complete\)\n'
              r'^\*\*Next:\*\* 5\.4-T3 - .*\n'
              r'^\*\*Blockers/drift/amendments:\*\* .*$',
              re.MULTILINE,
          )
          pointer = '''**Current slice:** Slice 5.4 - Durable release receipts (`IN PROGRESS`, 3/4 tasks complete)
**Next:** 5.4-T4 - run clean Distribution and required System cross-validation for the adopted durable-receipt path, confirm final release/debt/drift state, resolve `compact-release-receipt-not-yet-implemented` only if exact evidence proves the future-admission requirement is enforced, publish required closing Core State/ledger, close Slice 5.4 and Phase 5, advance to Slice 6.1, and stop without beginning Phase 6 execution
**Blockers/drift/amendments:** 5.4-T3 is complete at Distribution `f407302df93fee18ae407d59cf0409227436ddfe` via PR `#45`; final PR CI `39008232501` and clean-main CI `39008351455` both passed all six Linux/macOS/Windows Python 3.11/3.12 jobs, with 431 tests and 11 expected skips on Ubuntu/Python 3.11. The permanent tests-only matrix now proves exact reconstruction and destructive failure across release/evidence bytes, owner/component/descriptor bindings, Registry/State, locks, compatibility/preservation/promotion/debt, unsafe/floating refs, leakage and duplicate-authority attempts, while promotion planning remains read-only. Historical U36 evidence remains exact at blob `0fec6e5290e659469a52a5f769da620f329f8c5a`. Live candidate overlay remains empty, `current_release` remains `core-first-run-rc1-2026-10-12`, sync debt remains empty, and no live promotion or receipt instance was created. Canonical State/ledger were not refreshed, so `compact-release-receipt-not-yet-implemented` remains the existing `INFO/Core` record for T4 closure evaluation. No plan amendment required. 5.4-T4 has not begun.'''
          text, count = pointer_pattern.subn(pointer, text, count=1)
          if count != 1:
              raise SystemExit(f'current execution pointer: expected 1 match, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = "docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md"
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git rm .github/workflows/propagation-54-t3-bookkeeping.yml
          git diff --cached --check
          git commit -m "Record Slice 5.4 T3 reconstruction regressions"
          git push origin HEAD:main
