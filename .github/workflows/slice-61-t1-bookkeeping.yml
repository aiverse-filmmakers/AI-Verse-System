name: Slice 6.1 T1 Roadmap Bookkeeping

on:
  push:
    branches: [slice-6.1-t1-bookkeeping]
    paths:
      - ".github/workflows/slice-61-t1-bookkeeping.yml"

permissions:
  contents: write

jobs:
  record-t1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bookkeeping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact Slice 6.1 T1 evidence and pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '**Current slice status:** NOT STARTED  ',
                  '**Current slice status:** IN PROGRESS  ',
              ),
              (
                  '**Adaptive tasks:** 0/3 complete',
                  '**Adaptive tasks:** 1/3 complete',
              ),
              (
                  '- [ ] **6.1-T1** Create the read-only repository-network regression harness for governance/admission invariants using exact canonical System plus current five Core owner refs; reuse existing validators/regressions to prove owner routing and owner/Distribution separation, registered identity and exact pins, stale System/State inputs, unregistered repositories/components, stale watchdog, breaking contracts and candidate drift fail closed; do not mutate product/runtime/release/catalog/State/member data and do not perform end-to-end qualification.',
                  '- [x] **6.1-T1** Create the read-only repository-network regression harness for governance/admission invariants using exact canonical System plus current five Core owner refs; reuse existing validators/regressions to prove owner routing and owner/Distribution separation, registered identity and exact pins, stale System/State inputs, unregistered repositories/components, stale watchdog, breaking contracts and candidate drift fail closed; do not mutate product/runtime/release/catalog/State/member data and do not perform end-to-end qualification.\n\n### T1 evidence\n\n- Distribution PR #46 merged the T1-only harness/test tree at `5d47acf099f2f8e49566a34f3192e461fb0daf94`; the exact qualified PR head was `9cd1461c68c5d6d685f1b13a0e81bb7c9ebc97d0`. The permanent delta adds only `scripts/run-repository-network-governance-regression.py` and `tests/test_repository_network_governance_regression.py`; no permanent CI workflow was added because CI wiring belongs to 6.1-T3.\n- Exact temporary multi-repository qualification run `39056487468` completed `SUCCESS` against canonical System `b917f8812f21a02f4b58e402ce6dc5838303bb5d` plus the five current Repository-State-observed owner heads: OS `83747a90998077ad2ab4636f202ca2e065a9a6bb`, Brain `4406d15068284b88e0076b6dfff5aa0b06890a24`, Memory `09911eae0b4b0cbf7e7e7969230fe5b86647b841`, Skills `23779f10515951ac92c83cba34a1a868c02c4d87`, Data `7e9fadbd73752b24eb79e270aff6b311ad508109`. It proved tracked evidence remained unchanged.\n- The harness deliberately distinguishes current owner checkout heads from the older exact revisions accepted for the live release. It requires Registry identity/profile eligibility, State freshness/watchdog/current observed heads, exact descriptor blob/revision/owner-native evidence, exact Distribution release pins, no open intersecting `BLOCKING` drift, and fail-closed breaking-contract semantics without granting the harness Registry, State, owner-acceptance or release-admission authority.\n- Twelve focused T1 regressions prove the exact network passes read-only while wrong System revision, wrong release pin, unregistered Core component, stale watchdog, stale owner/component State, breaking-contract masquerade, Distribution Registry-authority expansion, missing owner-routing discovery path and open `BLOCKING` drift fail closed. The harness also reuses existing System Registry/State/watchdog/descriptor regressions and Distribution candidate-admission regressions.\n- PR Distribution CI `39056541163` passed all six Linux/macOS/Windows Python 3.11/3.12 jobs; Ubuntu/Python 3.11 passed Candidate admission, all 443 tests with 11 skipped, and catalog smoke. Clean-main Distribution CI `39056836830` on exact merge `5d47acf099f2f8e49566a34f3192e461fb0daf94` also passed all six jobs.\n- T1 changed no live release/catalog, Registry/State/ledger, promotion/channel, component owner implementation, member installation or user-owned state. It did not perform end-to-end qualification or preservation/reconstruction work. 6.1-T2 and 6.1-T3 remain unstarted. No plan amendment was required.',
              ),
              (
                  'Slice 6.1 planning is complete. 6.1-T1 through 6.1-T3 have not begun. No plan amendment was required.',
                  'Slice 6.1 planning is complete and 6.1-T1 is complete. 6.1-T2 and 6.1-T3 have not begun. No plan amendment was required.',
              ),
              (
                  '**Current slice:** Slice 6.1 - Cross-repo regression/evidence validation (`IN PROGRESS`, 0/3 tasks complete)\n**Next:** 6.1-T1 - create the read-only repository-network regression harness for governance/admission invariants using exact canonical System plus current five Core owner refs; reuse existing validators/regressions to prove owner routing and owner/Distribution separation, registered identity and exact pins, stale System/State inputs, unregistered repositories/components, stale watchdog, breaking contracts and candidate drift fail closed; do not mutate product/runtime/release/catalog/State/member data and do not perform end-to-end qualification\n**Blockers/drift/amendments:** Slice 6.1 bounded planning is complete at System `e98dd12026a15f82f92d119a713029dbad0742e5` and Distribution `5f2ce4bfe9902c3944ec2d467d7766516dede077`. Existing permanent invariant tests are reused rather than duplicated; the missing boundary is one current exact-ref cross-repository gate spanning System plus all five Core owners. The older Safe Infrastructure OS/Skills gate and historical System contract snapshot remain scoped historical evidence, not current 6.1 authority. Final live Core release remains `core-first-run-rc1-2026-10-12`, candidate overlay and sync debt remain empty, closing canonical State has no open drift, and no release/member/user-state mutation or State refresh occurred during planning. No plan amendment required. 6.1-T1 has not begun.',
                  '**Current slice:** Slice 6.1 - Cross-repo regression/evidence validation (`IN PROGRESS`, 1/3 tasks complete)\n**Next:** 6.1-T2 - extend the same permanent harness with preservation/reconstruction invariants by reusing lifecycle zero-loss and receipt regressions: member leakage must fail closed, legitimate member/user state must survive install/setup/update/rollback, owner-routed lifecycle failures remain owner-scoped, and durable receipt reconstruction/immutability/authority/leakage/debt bindings remain exact; preserve historical U36 and perform no live promotion\n**Blockers/drift/amendments:** 6.1-T1 is complete at Distribution `5d47acf099f2f8e49566a34f3192e461fb0daf94` via PR #46. Exact multi-repository qualification `39056487468`, PR CI `39056541163` and clean-main CI `39056836830` are green. The new read-only governance/admission harness binds canonical System plus all five current State-observed owner heads while preserving exact accepted release-pin and owner-authority boundaries; permanent CI wiring remains explicitly deferred to 6.1-T3. Final live Core release remains `core-first-run-rc1-2026-10-12`, candidate overlay and `system_sync_debts` remain empty, canonical State/ledger and member/user-owned state are unchanged, and no live promotion or end-to-end qualification occurred. No plan amendment required. 6.1-T2 has not begun.',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one roadmap match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          for p in "${changed[@]}"; do
            case "$p" in
              docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md|.github/workflows/slice-61-t1-bookkeeping.yml) ;;
              *) echo "SLICE 6.1 T1 BOOKKEEPING WRITE-SCOPE VIOLATION: $p" >&2; exit 1 ;;
            esac
          done

          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git rm .github/workflows/slice-61-t1-bookkeeping.yml
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md .github/workflows/slice-61-t1-bookkeeping.yml | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m "Record Slice 6.1 T1 governance regression evidence"
          git push origin HEAD:slice-6.1-t1-bookkeeping
