name: Propagation 54 T3 Bookkeeping Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/propagation-54-t3-bookkeeping-runner.yml'

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/propagation-54-t3-bookkeeping.py
      - run: git diff --check
      - run: |
          git config user.name AI-VERSE
          git config user.email hello@bogdanpascal.com
          git add docs/DISTRIBUTION-SYSTEM-PROPAGATION-IMPLEMENTATION-PLAN.md
          git rm .github/propagation-54-t3-bookkeeping.py
          git rm .github/workflows/propagation-54-t3-bookkeeping.yml
          git rm .github/workflows/propagation-54-t3-bookkeeping-runner.yml
          git diff --cached --check
          git commit -m 'Record Slice 5.4 T3 reconstruction regressions'
          git push origin HEAD:main
